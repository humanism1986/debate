<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>휴머니즘 · Debate</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div
    id="notice"
    role="status"
    aria-live="polite"
  ></div>

  <div
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <main id="app"></main>

  <dialog id="dialog">
    <form id="dialogForm">
      <h2 id="dialogTitle"></h2>

      <p id="dialogText"></p>

      <label
        id="dialogLabel"
        for="dialogInput"
      ></label>

      <input
        id="dialogInput"
        autocomplete="current-password"
      >

      <p
        id="dialogError"
        class="error"
        role="alert"
      ></p>

      <div class="row end">
        <button
          type="button"
          id="dialogCancel"
          class="secondary"
        >
          취소
        </button>

        <button
          type="submit"
          id="dialogConfirm"
        >
          확인
        </button>
      </div>
    </form>
  </dialog>

  <noscript>
    JavaScript를 켜야 사용할 수 있습니다.
  </noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
